<script id="lucky-github-api-bridge">
/* LUCKY POS GitHub Performance V2 */
const LUCKY_API_URL = 'https://script.google.com/macros/s/AKfycbxPvz2iERpCPOp57zcL5wHL-Hb9KR_achpVuDqZv4MQocgoPnW8YBBqxRKUnq9jIjAw/exec';

(function(){
  const inflight=new Map();
  const READ_ONLY=new Set([
    'bootstrapPOS','getAppData','pingPOS','getDashboardData','getSalesHistory',
    'getOrderDetails','getOpenOrders','getOrderHistory','getReceiptData',
    'getTableManagementData','getPrintBridgeSetup','getPrintBridgeStatus',
    'getInventoryData','getVoucherManagementData','validateVoucher',
    'getTableQrLinks','getCustomers','findCustomerByPhone','getCustomerDetails',
    'customerBootstrap','customerMyOrders'
  ]);

  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
  function keyOf(fn,args){try{return fn+'|'+JSON.stringify(args||[])}catch(_){return fn+'|'+Date.now()}}

  async function postOnce(fn,args,timeoutMs){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
    try{
      const r=await fetch(LUCKY_API_URL,{
        method:'POST',
        redirect:'follow',
        cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({api:'pos',fn:String(fn||''),args:Array.isArray(args)?args:[]}),
        signal:ctrl.signal
      });
      const t=await r.text();
      let data;
      try{data=JSON.parse(t)}catch(_){throw new Error('Server returned an invalid response.')}
      if(!data||data.ok!==true)throw new Error((data&&data.error)||'LUCKY POS API request failed.');
      return data.result;
    }finally{clearTimeout(timer)}
  }

  async function request(fn,args){
    if(!LUCKY_API_URL || LUCKY_API_URL.indexOf('PASTE_')===0)
      throw new Error('LUCKY API URL has not been configured yet.');

    const readOnly=READ_ONLY.has(fn);
    const k=keyOf(fn,args);
    if(readOnly && inflight.has(k)) return inflight.get(k);

    const task=(async()=>{
      const timeout=(fn==='login'?55000:(fn==='bootstrapPOS'?70000:50000));
      const tries=readOnly?2:1;
      let last;
      for(let i=0;i<tries;i++){
        try{return await postOnce(fn,args,timeout)}
        catch(e){
          last=e;
          if(i+1<tries) await sleep(650);
        }
      }
      if(last && last.name==='AbortError') throw new Error('Server response is taking too long. Please try again.');
      throw last;
    })();

    if(readOnly) inflight.set(k,task);
    try{return await task}
    finally{if(readOnly) inflight.delete(k)}
  }

  function invoke(fn,args,success,failure){
    request(fn,args).then(r=>{if(success)success(r)}).catch(e=>{if(failure)failure(e)});
  }

  function runner(success,failure){
    return new Proxy({},{
      get(_target,prop){
        if(prop==='withSuccessHandler')return cb=>runner(cb,failure);
        if(prop==='withFailureHandler')return cb=>runner(success,cb);
        return (...args)=>{
          if(prop==='apiCall'){
            const action=args[0], actionArgs=Array.isArray(args[1])?args[1]:[];
            return invoke(action,actionArgs,success,failure);
          }
          return invoke(prop,args,success,failure);
        };
      }
    });
  }

  window.google=window.google||{};
  window.google.script=window.google.script||{};
  Object.defineProperty(window.google.script,'run',{configurable:true,get(){return runner(null,null)}});
})();
</script>
